agents:
  root_agent:
    type: instance
    models: [gemini_settings.LIVE_MODEL_NAME]
    tools: [get_menu, get_informations, validate_order, validate_booking, cancel_booking]
    params:
      name: rootAgent
      instruction: get_root_prompt()
      function: create_root_agent

models:
  gemini_settings.LIVE_MODEL_NAME:
    type: literal
    agents: [root_agent]

tools:
  cancel_booking:
    type: function
    agents: [root_agent]
    params:
      description: |-
        Cancels a restaurant reservation.

        This tool handles reservation cancellation with the following workflow:

        1. If reservation_id is provided → delete directly
        2. Otherwise search by phone + date:
           - If unique match found → delete and confirm
           - If multiple matches → return all, ask user to clarify
           - If no match → search by phone only:
             - If found → return them, suggest user may have wrong date
             - If nothing → inform no reservation for this phone

        Parameters:
        - phone_number: Customer's phone number
        - date: Date of the reservation (various formats accepted)
        - reservation_id: Direct ID if user already specified which one (empty string if not provided)

        Returns:
        - CancelBookingResponse with success status, message, and found reservations if any
  get_informations:
    type: function
    agents: [root_agent]
    params:
      description: Return the complete informations of the restaurant such as location, opening hours, rules, website and
        all of these kind of infos.
  get_menu:
    type: function
    agents: [root_agent]
    params:
      description: Return the complete menu of the restaurant.
  validate_booking:
    type: function
    agents: [root_agent]
    params:
      description: |-
        Validates and creates a restaurant reservation.

        This tool receives booking information from the agent and:
        1. Validates the requested time is within service hours
        2. Runs a greedy algorithm to find available tables
        3. If available: creates the reservation and returns success
        4. If not available: returns up to 3 alternative time slots

        Parameters:
        - booking: BookingRequest with datetime, guests, location, customer info

        Returns:
        - BookingResponse with success status, message, and alternatives if needed
  validate_order:
    type: function
    agents: [root_agent]
    params:
      description: |-
        Validates and saves a customer order using an LLM validator.

        This tool receives a natural language description of the order,
        sends it to a validation LLM that parses it into a structured format,
        validates against the menu, and saves to database if valid.

        Parameters:
        - order_text: str - Description textuelle de la commande (ex: "2 pizzas margherita, 1 tiramisu, une formule midi avec une calzone et un coca")
        - customerName: str - Nom du client (obligatoire)
        - customerPhone: str - Téléphone du client (optionnel)

        Returns:
        - dict avec "success", "message"

